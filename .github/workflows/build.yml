# SPDX-License-Identifier: Apache-2.0
#
# GitHub Actions CI for PineTime Zephyr firmware
# Builds for Pebble Time 2 (pt2) and Pebble Round 2 (pr2) targets

name: Build PineTime Firmware

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        board: [pt2, pr2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pinetime
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: pinetime
          toolchains: arm-zephyr-eabi

      - name: Build firmware for ${{ matrix.board }}
        working-directory: pinetime
        run: |
          west build -p -b ${{ matrix.board }} app --build-dir build-${{ matrix.board }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            pinetime/build-${{ matrix.board }}/zephyr/zephyr.bin
            pinetime/build-${{ matrix.board }}/zephyr/zephyr.hex
            pinetime/build-${{ matrix.board }}/zephyr/zephyr.elf
          if-no-files-found: error
          retention-days: 30

      - name: Print build size report
        run: |
          cd pinetime
          west build -s -d build-${{ matrix.board }}

  check-compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: pinetime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          cd pinetime
          find app/src -name '*.c' -o -name '*.h' | head -100 | \
            xargs clang-format --dry-run --Werror 2>&1 || true
